[project]
name = "codlock-orchestrator-agent"
version = "0.1.0"
description = "CODLOCK Orchestrator Agent (A2A server)"
requires-python = ">=3.11"
dependencies = [
    "google-adk[a2a,extensions]>=2.6.3",
    "a2a-sdk[http-server]>=1.1.2",
    "supabase>=2.31.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[project.scripts]
orchestrator-agent = "codlock_agents.orchestrator.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codlock_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
